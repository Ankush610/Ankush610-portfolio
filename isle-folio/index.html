<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isle Folio</title>
<meta name="description" content="Ankush Sonawane — AI/ML & HPC engineer. A walkable 3D portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="icon" type="image/png" href="../shared/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="world" tabindex="0" aria-label="3D portfolio world. Walk with W A S D or the arrow keys, press E at a door to go inside, number keys travel to an island, M switches to top view, where you pick an island and the wizard walks there."></canvas>
<button class="back" id="backBtn" type="button" hidden>← Back outside</button>
<button class="back mode" id="modeBtn" type="button" hidden></button>
<a class="gate" href="../">⌂ Gateway</a>
<div class="hint" id="hint" aria-hidden="true"></div>
<button class="enter" id="enterBtn" type="button" hidden></button>
<nav class="isles" id="isles" hidden aria-label="Islands"></nav>
<div id="fader"></div>
<div class="loader" id="loader">RAISING THE ISLANDS…</div>
<div class="sr" id="live" aria-live="polite"></div>
<main class="sr" id="content"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
